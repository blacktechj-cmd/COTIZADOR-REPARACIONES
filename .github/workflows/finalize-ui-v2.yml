name: Finalizar UI y catálogo V2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Aplicar mejoras V2
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          p = Path('app.py')
          text = p.read_text(encoding='utf-8')

          # ---------- Normalización ----------
          marker = 'def clean_quality(text):'
          start = text.index(marker)
          end = text.index('\n\ndef init_db', start)
          helpers = '''def canonical_brand(text, fallback="Otra"):
              up = normalize(text).upper()
              aliases = {"IPHONE": "APPLE", "I PHONE": "APPLE"}
              for brand in BRANDS:
                  if re.search(rf"(?<!\\w){re.escape(brand)}(?!\\w)", up):
                      return aliases.get(brand, brand).title()
              return normalize(fallback).title() if fallback else "Otra"


          def canonical_model(text):
              m = normalize(text).upper()
              # Unifica referencias como A30/50 y A30/A50.
              m = re.sub(
                  r"\\b([A-Z]{1,3}\\d{1,4})\\s*/\\s*([A-Z]?)(\\d{1,4})\\b",
                  lambda x: f"{x.group(1)}/{x.group(2) or x.group(1)[0]}{x.group(3)}",
                  m,
              )
              m = re.sub(r"\\s+", " ", m).strip()
              return m.title()


          def clean_quality(text):
              q = normalize(text).upper()
              q = q.replace("INCELLL", "INCELL")
              q = re.sub(r"\\bC\\s*/\\s*M\\b", "CON MARCO", q)
              if re.search(r"\\bINCELL\\b", q):
                  q = re.sub(r"\\bLCD\\s+INCELL\\b", "INCELL", q)
                  q = re.sub(r"\\bINCELL\\s+LCD\\b", "INCELL", q)
              q = normalize(q)
              return q or "ESTÁNDAR"


          def screen_quality(text):
              up = str(text or "").upper()
              tokens = []
              for token in ["SOFT OLED", "INCELL", "OLED", "LCD", "ORIGINAL", "GX", "JK", "CON MARCO", "C/M"]:
                  if re.search(rf"(?<!\\w){re.escape(token)}(?!\\w)", up):
                      tokens.append("CON MARCO" if token == "C/M" else token)
              return clean_quality(" ".join(tokens)) if tokens else "INCELL"
          '''
          text = text[:start] + helpers + text[end:]

          # ---------- Base de datos: canonizar y deduplicar ----------
          old_rows = '''    rows = c.execute("SELECT id,repair,quality FROM references_").fetchall()
              for r in rows:
                  repair = normalize(r["repair"])
                  quality = clean_quality(r["quality"])
                  if repair.upper() in {"PANTALLA LCD", "DISPLAY LCD"}:
                      quality = clean_quality("LCD " + quality)
                      c.execute("UPDATE references_ SET repair='Pantalla', quality=? WHERE id=?", (quality, r["id"]))
                  elif repair.upper() in {"PANTALLA OLED", "DISPLAY OLED"}:
                      quality = clean_quality("OLED " + quality)
                      c.execute("UPDATE references_ SET repair='Pantalla', quality=? WHERE id=?", (quality, r["id"]))
                  elif repair.upper() in {"DISPLAY", "PANTALLA"}:
                      c.execute("UPDATE references_ SET repair='Pantalla', quality=? WHERE id=?", (quality, r["id"]))
'''
          new_rows = '''    rows = c.execute("SELECT id,brand,model,repair,quality FROM references_").fetchall()
              for r in rows:
                  repair = normalize(r["repair"])
                  repair_up = repair.upper()
                  if repair_up in {"PANTALLA LCD", "DISPLAY LCD"}:
                      repair = "Pantalla"
                      quality = screen_quality("LCD " + str(r["quality"] or ""))
                  elif repair_up in {"PANTALLA OLED", "DISPLAY OLED"}:
                      repair = "Pantalla"
                      quality = screen_quality("OLED " + str(r["quality"] or ""))
                  elif repair_up in {"DISPLAY", "PANTALLA"}:
                      repair = "Pantalla"
                      quality = screen_quality(r["quality"])
                  else:
                      quality = clean_quality(r["quality"])
                  brand = canonical_brand(r["brand"])
                  model = canonical_model(r["model"])
                  c.execute("UPDATE references_ SET brand=?,model=?,repair=?,quality=? WHERE id=?", (brand,model,repair,quality,r["id"]))
'''
          if old_rows in text:
              text = text.replace(old_rows, new_rows, 1)
          else:
              raise SystemExit('No se encontro migracion de referencias')

          text = text.replace(
              '    brand, model = normalize(brand).upper(), normalize(model).upper()\n    quality = clean_quality(quality)',
              '    brand = canonical_brand(brand)\n    model = canonical_model(model)\n    quality = screen_quality(quality) if repair.lower() == "pantalla" else clean_quality(quality)',
              1,
          )

          # ---------- Parser PDF / WhatsApp ----------
          text = text.replace(
              '            brand = normalize(current_brand).title() if current_brand else "Otra"',
              '            brand = canonical_brand(current_brand or desc)'
          )
          text = text.replace(
              '            model = normalize(model).strip(" -/").title()',
              '            model = canonical_model(model.strip(" -/"))',
              1,
          )
          text = text.replace(
              '    model = normalize(model).title()\n    return {"brand": brand, "model": model, "repair": repair, "quality": clean_quality(quality), "cost": cost}',
              '    model = canonical_model(model)\n    return {"brand": canonical_brand(brand), "model": model, "repair": repair, "quality": clean_quality(quality), "cost": cost}',
              1,
          )

          # ---------- Logo ----------
          assets = Path('assets')
          assets.mkdir(exist_ok=True)
          logo = assets / 'logo.svg'
          logo.write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1224 624"><rect width="1224" height="624" rx="30" fill="#fff"/><text x="612" y="100" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700">SERVICIO TÉCNICO</text><text x="485" y="330" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="145" font-weight="900">BLACK</text><text x="485" y="485" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="145" font-weight="900">TECH</text><path d="M1050 20L835 285H965L875 605L1185 220H1050L1135 20Z" fill="#000"/></svg>''', encoding='utf-8')

          # ---------- Interfaz completa ----------
          ui_start = text.index('st.markdown("""\n<style>')
          branch_start = text.index('if page == "💰 Cotizar":', ui_start)
          prefix = text[:ui_start]

          ui = '''st.markdown("""
          <style>
          .stApp{background:#f6f7fb}
          .block-container{max-width:1180px;padding:.7rem 1rem 4rem}
          .topbar{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:10px 14px;margin-bottom:12px;box-shadow:0 5px 18px rgba(15,23,42,.05)}
          .brandline{display:flex;align-items:center;gap:18px;padding:6px 4px 12px}
          .brandline img{width:210px;height:auto;max-height:76px;object-fit:contain}
          .brandcopy h1{margin:0;font-size:1.55rem;letter-spacing:.08em;color:#111827;font-weight:850}
          .brandcopy p{margin:3px 0 0;color:#64748b;font-size:.9rem}
          div[role="radiogroup"]{display:flex;gap:4px;align-items:flex-end;border-bottom:1px solid #e5e7eb;overflow-x:auto;white-space:nowrap}
          div[role="radiogroup"]>label{background:transparent!important;border-radius:0!important;border-bottom:2px solid transparent!important;padding:8px 12px 9px!important;color:#64748b!important;font-weight:650!important;min-width:max-content}
          div[role="radiogroup"]>label:has(input:checked){color:#111827!important;border-bottom:2px solid #ef4444!important}
          div[role="radiogroup"] input{display:none}
          .section-card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 5px 16px rgba(15,23,42,.04)}
          .brand-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;margin:9px 0;overflow:hidden}
          .brand-head{padding:12px 15px;font-weight:850;letter-spacing:.04em;background:#f8fafc;border-bottom:1px solid #e5e7eb}
          .big-result{background:linear-gradient(135deg,#eff6ff,#fff);border:2px solid #2563eb;border-radius:18px;padding:18px;text-align:center;margin:14px 0}.big-result .value{font-size:2.25rem;font-weight:800;color:#1d4ed8}.big-result .label{color:#64748b;font-size:.88rem}
          div[data-testid="stMetric"]{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:10px 12px}
          div[data-testid="stButton"]>button{border-radius:12px;font-weight:700;min-height:2.65rem}
          @media(max-width:700px){.block-container{padding:.5rem .55rem 3rem}.brandline{gap:10px}.brandline img{width:145px}.brandcopy h1{font-size:1.1rem}.brandcopy p{font-size:.78rem}div[role="radiogroup"]>label{padding:8px 9px 9px!important;font-size:.83rem!important}}
          </style>
          """, unsafe_allow_html=True)
          st.markdown('''<div class="topbar"><div class="brandline"><img src="assets/logo.svg"><div class="brandcopy"><h1>BLACK TECH</h1><p>Cotizador y catálogo profesional de repuestos</p></div></div></div>''', unsafe_allow_html=True)

          menu = ["📥 Importar", "🏆 Comparador", "🧾 Venta", "🧠 Catálogo maestro", "💾 Datos guardados"]
          page = st.radio("Módulo", menu, horizontal=True, label_visibility="collapsed", key="main_menu")
          allrefs = list(refs())
          '''

          bottom = '''

          if page == "📥 Importar":
              st.header("Importar referencias")
              source = st.radio("Fuente", ["📄 PDF MarkBoss", "📱 WhatsApp"], horizontal=True, key="import_source")
              if source == "📄 PDF MarkBoss":
                  st.caption("Importa pantallas y baterías. Las variantes de pantalla se normalizan automáticamente.")
                  uploaded = st.file_uploader("PDF de precios", type=["pdf"], key="pdf_upload_v2")
                  if uploaded:
                      if st.button("Analizar PDF", type="primary", use_container_width=True):
                          try:
                              rows, ignored = parse_pdf(uploaded.getvalue())
                              st.session_state.pdf_rows = rows
                              st.session_state.pdf_ignored = ignored
                              screens = sum(1 for r in rows if r["repair"] == "Pantalla")
                              batteries = sum(1 for r in rows if r["repair"] == "Batería")
                              st.success(f"Encontradas {len(rows)} referencias: {screens} pantallas y {batteries} baterías.")
                          except Exception as e:
                              st.error(f"No se pudo analizar el PDF: {e}")
                  rows = st.session_state.get("pdf_rows", [])
                  if rows:
                      st.dataframe([{"Marca":r["brand"],"Modelo":r["model"],"Tipo":r["repair"],"Variante":r["quality"],"Precio":money(r["cost"]),"Página":r["page"]} for r in rows], use_container_width=True, hide_index=True)
                      if st.button("Importar / actualizar catálogo", type="primary", use_container_width=True):
                          a,u=import_rows(rows,"MarkBoss Repuestos")
                          st.success(f"Catálogo actualizado: {a} nuevas · {u} actualizadas.")
                          st.session_state.pdf_rows=[]
                          st.rerun()
              else:
                  ps=list(providers()); names=[p["name"] for p in ps]
                  if names:
                      provider_name=st.selectbox("Proveedor",names)
                      text_wa=st.text_area("Lista de WhatsApp",height=240,placeholder="Xiaomi Redmi 13 INCELL 42.000\\nSamsung A30/50 INCELL 35.000")
                      if st.button("Analizar lista",type="primary",use_container_width=True):
                          st.session_state.wa_rows=[x for x in (normalize_whatsapp_line(line) for line in text_wa.splitlines()) if x]
                          st.success(f"Se reconocieron {len(st.session_state.wa_rows)} líneas.")
                      rows=st.session_state.get("wa_rows",[])
                      if rows:
                          st.dataframe([{"Marca":r["brand"],"Modelo":r["model"],"Tipo":r["repair"],"Variante":r["quality"],"Costo":money(r["cost"])} for r in rows],use_container_width=True,hide_index=True)
                          if st.button("Guardar / actualizar referencias",type="primary",use_container_width=True):
                              a,u=import_rows(rows,provider_name)
                              st.success(f"Guardado: {a} nuevas · {u} actualizadas.")
                              st.session_state.wa_rows=[]
                              st.rerun()
                  else:
                      st.warning("Crea primero un proveedor en Catálogo maestro.")

          elif page == "🏆 Comparador":
              st.header("Comparador y cotizador")
              brands=sorted(set(r["brand"] for r in allrefs),key=str.lower)
              a,b=st.columns(2)
              brand=a.selectbox("Marca",[""]+brands,format_func=lambda x:"Selecciona una marca..." if not x else x,key="q_brand_v2")
              models=sorted(set(r["model"] for r in allrefs if not brand or r["brand"].lower()==brand.lower()),key=str.lower)
              model=b.selectbox("Modelo",[""]+models,format_func=lambda x:"Selecciona un modelo..." if not x else x,key="q_model_v2")
              available=[r for r in allrefs if (not brand or r["brand"].lower()==brand.lower()) and (not model or r["model"].lower()==model.lower())]
              repair=st.selectbox("Tipo de reparación",[""]+REPAIRS,format_func=lambda x:"Selecciona el tipo de reparación..." if not x else x,key="q_repair_v2")
              matches=[r for r in available if r["repair"].lower()==repair.lower()] if repair else []
              selected=None
              if matches:
                  labels=[f"{r['quality'] or 'INCELL'} · {r['provider']} · {money(r['cost'])}" for r in matches]
                  idx=st.selectbox("Referencia",range(len(matches)),format_func=lambda i:labels[i],key="q_ref_v2")
                  selected=matches[idx]
                  if st.button("＋ Agregar reparación",type="primary",use_container_width=True):
                      add_quote(selected);st.rerun()
              elif repair:
                  st.info("No hay una referencia registrada para este modelo y reparación.")
              if st.session_state.quote:
                  st.subheader("Reparaciones agregadas")
                  for i,r in enumerate(st.session_state.quote):
                      with st.container(border=True):
                          x,y,z=st.columns([5,2,1]);x.write(f"**{r['repair']} · {r['quality'] or 'INCELL'}**");x.caption(f"{r['brand']} {r['model']} · {r['provider']}");y.write(money(r['cost']))
                          if z.button("Quitar",key=f"remove_v2_{i}"): st.session_state.quote.pop(i);st.rerun()
                  default_labor=calculate(st.session_state.quote)[2]
                  if st.session_state.get("labor_override",0)==0: st.session_state.labor_override=int(default_labor)
                  st.number_input("Mano de obra",min_value=0,step=1000,key="labor_override")
                  parts,logistics,labor,base,pmin,prec,pprem=calculate(st.session_state.quote)
                  a,b,c=st.columns(3);a.metric("Repuestos",money(parts));b.metric("Logística",money(logistics));c.metric("Mano de obra",money(labor))
                  st.markdown(f'<div class="big-result"><div class="label">COSTO REAL</div><div class="value">{money(base)}</div></div>',unsafe_allow_html=True)
                  a,b,c=st.columns(3);a.metric("Mínimo",money(pmin));b.metric("RECOMENDADO",money(prec));c.metric("Premium",money(pprem))
                  a,b=st.columns(2)
                  if a.button("Guardar cotización",type="primary",use_container_width=True):
                      payload={"items":[dict(x) for x in st.session_state.quote],"parts":parts,"logistics":logistics,"labor":labor,"base":base,"recommended":prec,"premium":pprem,"saved_at":datetime.now().isoformat(timespec="seconds")}
                      cdb=db();cdb.execute("INSERT INTO history(created_at,data) VALUES(?,?)",(datetime.now().isoformat(timespec="seconds"),json.dumps(payload,ensure_ascii=False)));cdb.commit();cdb.close();st.success("Cotización guardada.")
                  if b.button("Limpiar cotización",use_container_width=True): reset_quote();st.rerun()
              else:
                  st.info("Selecciona una reparación y una referencia para comparar proveedores y costos.")

          elif page == "🧾 Venta":
              st.header("Venta de repuestos")
              st.caption("Busca una referencia y obtén precios de venta orientativos según los márgenes configurados.")
              q=st.text_input("Buscar repuesto",placeholder="Ej. Samsung A30/A50, iPhone 13, INCELL...")
              term=q.strip().lower()
              data=[r for r in allrefs if not term or term in " ".join(str(r[k] or "") for k in ["brand","model","repair","quality","provider"]).lower()]
              s=settings();rnd=int(s["rounding"] or 1000)
              for r in data:
                  sale_rec=round((int(r["cost"])*(1+s["margin_rec"]/100))/rnd)*rnd
                  sale_prem=round((int(r["cost"])*(1+s["margin_prem"]/100))/rnd)*rnd
                  with st.container(border=True):
                      a,b,c=st.columns([5,2,2]);a.write(f"**{r['brand']} {r['model']}**");a.caption(f"{r['repair']} · {r['quality'] or 'INCELL'} · {r['provider']}");b.metric("Costo",money(r["cost"]));c.metric("Venta",money(sale_rec));st.caption(f"Premium sugerido: {money(sale_prem)}")
              if not data: st.info("No encontramos referencias con esa búsqueda.")

          elif page == "🧠 Catálogo maestro":
              st.header("Catálogo maestro")
              tab_ref,tab_prov,tab_cfg=st.tabs(["📚 Referencias","🚚 Proveedores","⚙️ Configuración"])
              with tab_ref:
                  st.caption("Las referencias están agrupadas por marca. A30/50 y A30/A50 se consideran el mismo modelo.")
                  ps=list(providers());provider_names=[p["name"] for p in ps]
                  with st.form("new_ref_v2"):
                      brands_existing=sorted(set(r["brand"] for r in allrefs),key=str.lower)
                      brand=st.selectbox("Marca",["＋ Nueva marca..."]+brands_existing)
                      brand_manual=st.text_input("Nueva marca") if brand.startswith("＋") else brand
                      models_existing=sorted(set(r["model"] for r in allrefs if r["brand"].lower()==brand_manual.lower()),key=str.lower)
                      model=st.selectbox("Modelo",["＋ Nuevo modelo..."]+models_existing)
                      model_manual=st.text_input("Nuevo modelo") if model.startswith("＋") else model
                      a,b=st.columns(2);repair=a.selectbox("Tipo de reparación",REPAIRS);quality=b.text_input("Variante / calidad",placeholder="INCELL, OLED, CON MARCO...")
                      a,b=st.columns(2);provider_name=a.selectbox("Proveedor",provider_names) if provider_names else None;cost=b.number_input("Costo",min_value=0,step=1000)
                      note=st.text_area("Nota")
                      if st.form_submit_button("Guardar / actualizar referencia",type="primary",use_container_width=True):
                          bc=(brand_manual if brand.startswith("＋") else brand).strip();mc=(model_manual if model.startswith("＋") else model).strip()
                          if not bc or not mc or cost<=0 or not provider_names: st.error("Marca, modelo, proveedor y costo son obligatorios.")
                          else:
                              pid=next(p["id"] for p in ps if p["name"]==provider_name);action=upsert_reference(bc,mc,repair,quality,pid,cost,note);st.success(f"Referencia {action} correctamente.");st.rerun()
                  q=st.text_input("Buscar referencias",placeholder="Ej. A30/50, iPhone 13, INCELL...")
                  filtered=[r for r in refs() if not q.strip().lower() or q.strip().lower() in " ".join(str(r[k] or "") for k in ["brand","model","repair","quality","provider"]).lower()]
                  brands_sorted=sorted(set(r["brand"] for r in filtered),key=str.lower)
                  st.caption(f"{len(filtered)} referencia(s) encontrada(s) en {len(brands_sorted)} marca(s).")
                  for brand_name in brands_sorted:
                      brand_rows=[r for r in filtered if r["brand"]==brand_name]
                      with st.expander(f"🏷️ {brand_name} · {len(brand_rows)} referencia(s)",expanded=len(brands_sorted)==1):
                          models_sorted=sorted(set(r["model"] for r in brand_rows),key=str.lower)
                          for model_name in models_sorted:
                              model_rows=[r for r in brand_rows if r["model"]==model_name]
                              st.markdown(f"**{model_name}**")
                              st.dataframe([{"Reparación":r["repair"],"Variante":r["quality"] or "INCELL","Proveedor":r["provider"],"Costo":money(r["cost"])} for r in model_rows],use_container_width=True,hide_index=True)
              with tab_prov:
                  for p in providers():
                      with st.expander(p["name"]):
                          with st.form(f"provider_v2_{p['id']}"):
                              name=st.text_input("Nombre",p["name"]);delivery=st.selectbox("Entrega",["Recogida presencial","Envío","Ambos"],index=["Recogida presencial","Envío","Ambos"].index(p["delivery"]));a,b=st.columns(2);shipping=a.number_input("Envío",min_value=0,step=1000,value=int(p["shipping"]));travel=b.number_input("Desplazamiento",min_value=0,step=1000,value=int(p["travel"]));note=st.text_area("Nota",p["note"] or "")
                              if st.form_submit_button("Guardar cambios",use_container_width=True):
                                  c=db();c.execute("UPDATE providers SET name=?,delivery=?,shipping=?,travel=?,note=? WHERE id=?",(name.strip(),delivery,shipping,travel,note,p["id"]));c.commit();c.close();st.rerun()
                  with st.form("new_provider_v2"):
                      name=st.text_input("Nuevo proveedor");delivery=st.selectbox("Entrega",["Recogida presencial","Envío","Ambos"]);a,b=st.columns(2);shipping=a.number_input("Envío",min_value=0,step=1000);travel=b.number_input("Desplazamiento",min_value=0,step=1000);note=st.text_area("Nota")
                      if st.form_submit_button("Agregar proveedor",use_container_width=True):
                          if name.strip(): c=db();c.execute("INSERT INTO providers(name,delivery,shipping,travel,note) VALUES(?,?,?,?,?)",(name.strip(),delivery,shipping,travel,note));c.commit();c.close();st.rerun()
              with tab_cfg:
                  s=settings();a,b,c=st.columns(3);mn=a.number_input("Margen mínimo %",value=float(s["margin_min"]),step=1.0);mr=b.number_input("Margen recomendado %",value=float(s["margin_rec"]),step=1.0);mp=c.number_input("Margen premium %",value=float(s["margin_prem"]),step=1.0);a,b=st.columns(2);rnd=a.number_input("Redondeo",min_value=1,value=int(s["rounding"]),step=1000);bundle=b.number_input("Mano de obra 2+ reparaciones",min_value=0,value=int(s["bundle_labor"]),step=1000)
                  labor_values={};cols=st.columns(2)
                  for i,repair_name in enumerate(REPAIRS): labor_values[repair_name]=cols[i%2].number_input(repair_name,min_value=0,value=int(s.get(f"labor_{repair_name}",DEFAULT_LABOR[repair_name])),step=1000,key=f"labor_v2_{i}")
                  if st.button("Guardar configuración",type="primary",use_container_width=True):
                      cdb=db()
                      for k,v in [("margin_min",mn),("margin_rec",mr),("margin_prem",mp),("rounding",rnd),("bundle_labor",bundle)]: cdb.execute("INSERT INTO settings(key,value) VALUES(?,?) ON CONFLICT(key) DO UPDATE SET value=excluded.value",(k,str(v)))
                      for repair_name,value in labor_values.items(): cdb.execute("INSERT INTO settings(key,value) VALUES(?,?) ON CONFLICT(key) DO UPDATE SET value=excluded.value",(f"labor_{repair_name}",str(value)))
                      cdb.commit();cdb.close();st.success("Configuración guardada.")

          elif page == "💾 Datos guardados":
              st.header("Datos guardados")
              search=st.text_input("Buscar equipo o reparación",placeholder="Ej. Redmi 13, iPhone 13, pantalla, batería...")
              rows=db().execute("SELECT * FROM history ORDER BY id DESC").fetchall();term=search.strip().lower();found=[]
              for r in rows:
                  data=json.loads(r["data"]);equipment=history_equipment(data);repairs=history_repairs(data);haystack=(equipment+" "+repairs+" "+" ".join(str(x.get("quality","")) for x in data.get("items",[]))).lower()
                  if not term or term in haystack: found.append((r,data,equipment,repairs))
              st.caption(f"{len(found)} cotización(es) encontrada(s).")
              if not rows: st.info("Todavía no hay cotizaciones guardadas.")
              elif not found: st.warning("No encontramos resultados para esa búsqueda.")
              else:
                  for r,data,equipment,repairs in found:
                      with st.container(border=True):
                          st.markdown(f'<b>📱 {equipment}</b><br><small>📅 {r["created_at"]} · 🛠️ {repairs}</small>',unsafe_allow_html=True)
                          a,b,c=st.columns(3);a.metric("Repuestos",money(data.get("parts",0)));b.metric("Costo real",money(data.get("base",0)));c.metric("Recomendado",money(data.get("recommended",0)))
                          with st.expander("Ver detalles"):
                              for item in data.get("items",[]): st.write(f"• **{item.get('repair','Reparación')}** · {item.get('quality') or 'INCELL'} · {item.get('provider','Proveedor')} · {money(item.get('cost',0))}")

          '''

          text = prefix + ui + bottom
          p.write_text(text, encoding='utf-8')

