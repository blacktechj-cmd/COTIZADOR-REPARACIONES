name: Corregir workflow UI V2

on:
  workflow_run:
    workflows: ["Finalizar UI y catálogo V2"]
    types: [completed]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Corregir bloques multilinea del workflow
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/finalize-ui-v2.yml')
          if not p.exists():
              raise SystemExit(0)
          t=p.read_text(encoding='utf-8')
          t=t.replace("helpers = '''", "helpers = textwrap.dedent('''", 1)
          t=t.replace("          '''\n          text = text[:start] + helpers + text[end:]", "          ''')\n          text = text[:start] + helpers + text[end:]", 1)
          t=t.replace("ui = '''", "ui = textwrap.dedent('''", 1)
          t=t.replace("          '''\n\n          bottom = '''", "          ''')\n\n          bottom = textwrap.dedent('''", 1)
          t=t.replace("          '''\n\n          text = prefix + ui + bottom", "          ''')\n\n          text = prefix + ui + bottom", 1)
          p.write_text(t,encoding='utf-8')
      - name: Guardar correccion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/finalize-ui-v2.yml
          git commit -m "Corregir indentacion del workflow UI V2" || exit 0
          git push
